<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Todo List</h1>

        <div class="input-container">

            <input type="text" id="taskInput" placeholder="Masukkan tugas...">

            <button id="addButton">
                Tambah
            </button>

        </div>

        <!-- Tempat daftar tugas -->
        <ul id="taskList"></ul>

        <!-- Pesan jika belum ada tugas -->
        <p id="emptyMessage">
            Belum ada tugas.
        </p>

    </div>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>

</html>
